<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriLeitner Pro SaaS: Cloud & AI Powered</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tailwind Config for Class-Based Dark Mode & Brand Colors -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#059669'
          }
        }
      }
    }
  </script>
  
  <!-- Supabase Client JS CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Pay API -->
  <script async src="https://pay.google.com/gp/p/js/pay.js"></script>

  <style>
    @keyframes pulse-red { 0%, 100% { background-color: #ef4444; } 50% { background-color: #991b1b; } }
    .timer-critical { animation: pulse-red 1s infinite; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    
    /* Loading Spinners */
    .spinner { border: 2.5px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s ease-in-out infinite; width: 14px; height: 14px; display: inline-block; }
    .spinner-brand { border: 2.5px solid rgba(5,150,105,0.2); border-radius: 50%; border-top-color: #059669; animation: spin 0.8s ease-in-out infinite; width: 32px; height: 32px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Supabase Config (Reusing your shopping mall credentials) ---
    const SUPABASE_URL = "https://cfimyvvecsoqeicsjezo.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmaW15dnZlY3NvcWVpY3NqZXpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwOTg4ODAsImV4cCI6MjA4OTY3NDg4MH0.mxkQ9gqEBm63yGcXfx8DXVtQscgqn0g5slD-SUahc78";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const DEFAULT_CONFIG = {
      timerDuration: 7,
      intervals: { 1: 1, 2: 3, 3: 7, 4: 14, 5: 30, 6: 60, 7: 90 }
    };

    // --- Google Pay Constants ---
    const GOOGLE_PAY_BASE_REQUEST = {
      apiVersion: 2,
      apiVersionMinor: 0
    };
    const GOOGLE_PAY_ALLOWED_NETWORKS = ["AMEX", "DISCOVER", "INTERAC", "JCB", "MASTERCARD", "VISA"];
    const GOOGLE_PAY_ALLOWED_AUTH_METHODS = ["PAN_ONLY", "CRYPTOGRAM_3DS"];
    const GOOGLE_PAY_TOKENIZATION_SPEC = {
      type: 'PAYMENT_GATEWAY',
      parameters: {
        'gateway': 'example',
        'gatewayMerchantId': 'exampleGatewayMerchantId'
      }
    };
    const GOOGLE_PAY_BASE_CARD_METHOD = {
      type: 'CARD',
      parameters: {
        allowedAuthMethods: GOOGLE_PAY_ALLOWED_AUTH_METHODS,
        allowedCardNetworks: GOOGLE_PAY_ALLOWED_NETWORKS
      }
    };
    const GOOGLE_PAY_CARD_METHOD = Object.assign(
      {},
      GOOGLE_PAY_BASE_CARD_METHOD,
      { tokenizationSpecification: GOOGLE_PAY_TOKENIZATION_SPEC }
    );

    // --- High-difficulty Agri-Engineering Terms for Initial Population ---
    const INITIAL_CARDS = [
      {
        term: "Foliar Treatment",
        meaning: "경엽처리 (식물체의 잎과 줄기에 제초제나 비료를 직접 살포하는 방제법)",
        morphology: { prefix: "Foli (잎)", root: "ar (의)", suffix: "Treatment (처리)" },
        context_sentence: "잡초의 생장점에서 신속히 흡수되도록 제초제를 Foliar Treatment하여 잡초 방제 효율을 극대화했습니다.",
        stage: 1,
        next_review_at: new Date().toISOString().split('T')[0],
        is_graduated: false
      },
      {
        term: "Pollinizer",
        meaning: "수분수 (과수원에서 타가수분을 유도하여 결실률을 높이기 위해 꽃가루를 공급하는 나무)",
        morphology: { prefix: "Pollin (꽃가루)", root: "ize (되다)", suffix: "er (것)" },
        context_sentence: "자가 결실률이 낮은 사과 품종의 재배지에 꽃가루가 풍부한 Pollinizer 품종을 일정한 비율로 혼식 설계했습니다.",
        stage: 1,
        next_review_at: new Date().toISOString().split('T')[0],
        is_graduated: false
      },
      {
        term: "Vernalization",
        meaning: "춘화처리 (작물의 개화를 유도하고 성장을 조절하기 위해 일정 기간 저온 노출을 적용하는 처리)",
        morphology: { prefix: "Vern (봄)", root: "al (의)", suffix: "ization (처리/화)" },
        context_sentence: "가을보리를 봄에 파종하기 전에 습한 상태에서 저온 처리를 하는 Vernalization 과정을 가하여 개화를 정상화했습니다.",
        stage: 1,
        next_review_at: new Date().toISOString().split('T')[0],
        is_graduated: false
      },
      {
        term: "Grafted Seedling",
        meaning: "접목묘 (강인한 대목과 우수한 접수를 결합하여 토양 병해충 저항성과 생장력을 키운 융합 묘목)",
        morphology: { prefix: "Graft (접목)", root: "ed (된)", suffix: "Seedling (묘목)" },
        context_sentence: "토양 전염성 병원균 피해를 극복하고 건실한 생장 환경을 조성하기 위해 참외 수박 정식 시 Grafted Seedling을 배치했습니다.",
        stage: 1,
        next_review_at: new Date().toISOString().split('T')[0],
        is_graduated: false
      },
      {
        term: "Dormancy Breaking",
        meaning: "휴면타파 (자연적/인위적으로 식물의 잠자는 상태를 깨워 균일한 발아 및 성장을 촉진하는 작용)",
        morphology: { prefix: "Dorm (잠자다)", root: "ancy (상태)", suffix: "Breaking (깨우기)" },
        context_sentence: "봄철 포도나무의 균일하고 빠른 발아를 촉진하기 위해 약제를 살포하여 조기에 Dormancy Breaking을 실시했습니다.",
        stage: 1,
        next_review_at: new Date().toISOString().split('T')[0],
        is_graduated: false
      }
    ];

    function App() {
      // Auth States
      const [session, setSession] = useState(null);
      const [user, setUser] = useState(null);
      const [profile, setProfile] = useState(null); // SaaS Billing/Usage Info
      const [authEmail, setAuthEmail] = useState("");
      const [authPassword, setAuthPassword] = useState("");
      const [isSignUp, setIsSignUp] = useState(false);
      const [authLoading, setAuthLoading] = useState(false);
      
      // Navigation & Settings
      const [activeTab, setActiveTab] = useState('study');
      const [cards, setCards] = useState([]);
      const [config, setConfig] = useState(DEFAULT_CONFIG);
      const [isLoaded, setIsLoaded] = useState(false);
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [apiKey, setApiKey] = useState("");
      
      // Study Session State
      const [sessionDeck, setSessionDeck] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isRevealed, setIsRevealed] = useState(false);
      const [timeLeft, setTimeLeft] = useState(7);

      // AI Generation State
      const [genKeyword, setGenKeyword] = useState("");
      const [isGenerating, setIsGenerating] = useState(false);
      const [genResult, setGenResult] = useState(null);

      // Search State inside Manage Tab
      const [searchQuery, setSearchQuery] = useState("");

      // Modal States
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingCard, setEditingCard] = useState(null);
      const [isUpgradeModalOpen, setIsUpgradeModalOpen] = useState(false);
      const [payLoading, setPayLoading] = useState(false);
      const [isGooglePayReady, setIsGooglePayReady] = useState(false);

      // UI/UX Enhancement States (Toasts & AI Steps)
      const [toasts, setToasts] = useState([]);
      const [genStep, setGenStep] = useState(1);

      const showToast = (message, type = 'success') => {
        const id = Date.now() + Math.random().toString(36).substr(2, 9);
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4000);
      };

      // 1. Auth Change Listener
      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          setUser(session?.user ?? null);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          setUser(session?.user ?? null);
        });

        return () => subscription.unsubscribe();
      }, []);

      // 2. Fetch API Key and Dark Mode preferences Locally
      useEffect(() => {
        const storedTheme = localStorage.getItem('agri_pro_theme_v5');
        const storedApi = localStorage.getItem('agri_pro_api_v5');
        if (storedApi) setApiKey(storedApi);
        if (storedTheme === 'dark') {
          setIsDarkMode(true);
          document.documentElement.classList.add('dark');
        } else {
          setIsDarkMode(false);
          document.documentElement.classList.remove('dark');
        }
        setIsLoaded(true);
      }, []);

      // 3. User & Cloud Sync Triggers
      useEffect(() => {
        if (user) {
          fetchProfile();
          fetchCards();
        } else {
          setProfile(null);
          setCards([]);
          setSessionDeck([]);
        }
      }, [user]);

      // 4. Local Preferences Storage Sync
      useEffect(() => {
        if (isLoaded) {
          localStorage.setItem('agri_pro_theme_v5', isDarkMode ? 'dark' : 'light');
          localStorage.setItem('agri_pro_api_v5', apiKey);
        }
      }, [isDarkMode, apiKey, isLoaded]);

      // 5. Google Pay Actions & Button Handler
      const handleGooglePayClicked = () => {
        if (typeof window.google === 'undefined' || !window.google.payments) return;

        const paymentsClient = new window.google.payments.api.PaymentsClient({
          environment: 'TEST'
        });

        const paymentDataRequest = Object.assign({}, GOOGLE_PAY_BASE_REQUEST);
        paymentDataRequest.allowedPaymentMethods = [GOOGLE_PAY_CARD_METHOD];
        paymentDataRequest.merchantInfo = {
          merchantName: 'AgriLeitner Pro'
        };
        paymentDataRequest.transactionInfo = {
          countryCode: 'KR',
          currencyCode: 'KRW',
          totalPriceStatus: 'FINAL',
          totalPrice: '19900'
        };

        setPayLoading(true);

        paymentsClient.loadPaymentData(paymentDataRequest)
          .then(async (paymentData) => {
            try {
              const { data: updatedProfile, error } = await supabase
                .from('agri_profiles')
                .update({ tier: 'Pro' })
                .eq('id', user.id)
                .select()
                .single();
              if (error) throw error;
              setProfile(updatedProfile);
              setIsUpgradeModalOpen(false);
              showToast("축하합니다! Google Pay로 Pro 요금제 결제가 완료되었으며 무제한 AI 단어 생성이 활성화되었습니다.", "success");
            } catch (err) {
              showToast("프로필 업데이트 실패: " + err.message, "error");
            } finally {
              setPayLoading(false);
            }
          })
          .catch((err) => {
            console.error("Google Pay payment error:", err);
            showToast("Google Pay 결제가 취소되었거나 오류가 발생했습니다.", "error");
            setPayLoading(false);
          });
      };

      // 6. Google Pay Button Mounting effect
      useEffect(() => {
        if (!isUpgradeModalOpen) return;

        if (typeof window.google === 'undefined' || !window.google.payments) {
          console.warn("Google Pay SDK not loaded.");
          return;
        }

        let paymentsClient;
        try {
          paymentsClient = new window.google.payments.api.PaymentsClient({
            environment: 'TEST'
          });
        } catch (e) {
          console.error("Failed to create PaymentsClient:", e);
          return;
        }

        const isReadyToPayRequest = Object.assign(
          {},
          GOOGLE_PAY_BASE_REQUEST,
          { allowedPaymentMethods: [GOOGLE_PAY_BASE_CARD_METHOD] }
        );

        paymentsClient.isReadyToPay(isReadyToPayRequest)
          .then((response) => {
            if (response.result) {
              setIsGooglePayReady(true);
              
              const button = paymentsClient.createButton({
                onClick: handleGooglePayClicked,
                buttonColor: isDarkMode ? 'white' : 'default',
                buttonType: 'subscribe',
                buttonSizeMode: 'fill'
              });

              const container = document.getElementById('google-pay-button-container');
              if (container) {
                container.innerHTML = '';
                container.appendChild(button);
              }
            } else {
              setIsGooglePayReady(false);
            }
          })
          .catch((err) => {
            console.error("Google Pay isReadyToPay error:", err);
            setIsGooglePayReady(false);
          });
      }, [isUpgradeModalOpen, isDarkMode]);

      // 7. Study Session Timer Effect (Decrement timeLeft every second when active and not revealed)
      useEffect(() => {
        if (activeTab !== 'study' || sessionDeck.length === 0 || isRevealed) return;
        if (timeLeft <= 0) {
          setIsRevealed(true);
          return;
        }

        const timer = setTimeout(() => {
          setTimeLeft(p => p - 1);
        }, 1000);

        return () => clearTimeout(timer);
      }, [activeTab, sessionDeck, isRevealed, timeLeft]);

      const toggleTheme = () => {
        const nextDark = !isDarkMode;
        setIsDarkMode(nextDark);
        if (nextDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      };

      // --- SaaS Cloud Database Fetch/Setup Functions ---
      const fetchProfile = async () => {
        try {
          const { data, error } = await supabase
            .from('agri_profiles')
            .select('*')
            .eq('id', user.id)
            .single();
          if (error) {
            // If profile record is missing (sometimes trigger delay), manually provision it
            if (error.code === 'PGRST116') {
              const { data: newProfile, error: createError } = await supabase
                .from('agri_profiles')
                .insert([{ id: user.id, email: user.email, tier: 'Free', ai_generations_count: 0 }])
                .select()
                .single();
              if (!createError) setProfile(newProfile);
            } else {
              console.error("Profile fetch error:", error);
            }
          } else {
            setProfile(data);
          }
        } catch (err) {
          console.error(err);
        }
      };

      const fetchCards = async () => {
        try {
          const { data, error } = await supabase
            .from('agri_cards')
            .select('*')
            .order('created_at', { ascending: false });
          if (error) throw error;

          // If a new account has 0 cards, prepopulate with the 5 high-difficulty core cards
          if (data.length === 0) {
            const initialWithUserId = INITIAL_CARDS.map(c => ({
              ...c,
              user_id: user.id
            }));
            const { data: inserted, error: insertError } = await supabase
              .from('agri_cards')
              .insert(initialWithUserId)
              .select();
            if (!insertError) setCards(inserted);
          } else {
            setCards(data);
          }
        } catch (err) {
          console.error("Cards fetch error:", err);
        }
      };

      // --- Auth Management Functions ---
      const handleAuth = async (e) => {
        e.preventDefault();
        if (!authEmail.trim() || !authPassword.trim()) return;
        setAuthLoading(true);

        try {
          if (isSignUp) {
            const { data, error } = await supabase.auth.signUp({
              email: authEmail,
              password: authPassword,
            });
            if (error) throw error;
            alert("회원가입 확인 이메일이 발송되었습니다! 이메일 내 링크를 클릭하여 인증을 완료해주세요.");
          } else {
            const { error } = await supabase.auth.signInWithPassword({
              email: authEmail,
              password: authPassword,
            });
            if (error) throw error;
          }
        } catch (err) {
          alert("인증 오류: " + err.message);
        } finally {
          setAuthLoading(false);
        }
      };

      const handleSignOut = async () => {
        if (confirm("로그아웃 하시겠습니까?")) {
          await supabase.auth.signOut();
        }
      };

      const signInWithGoogle = async () => {
        if (window.location.protocol === 'file:') {
          alert(
            "⚠️ 구글 로그인은 보안(OAuth 2.0) 규정상 로컬 파일(file://) 환경에서는 작동하지 않으며, 쇼핑몰 사이트로 리다이렉트 처리됩니다.\n\n" +
            "구글 로그인을 정상 이용하시려면:\n" +
            "1. 폴더 내 제공해 드린 'run_local_server.bat' 파일을 더블 클릭하여 로컬 웹 서버(http://localhost:5000)를 가동하십시오.\n" +
            "2. 가동된 로컬 주소(http://localhost:5000/leitner_app.html)로 재접속하여 로그인해 주십시오.\n" +
            "3. 또는 VS Code의 'Live Server' 플러그인을 사용하여 가동해 주십시오.\n\n" +
            "※ Supabase 설정 창(URL Configuration)에서 Redirect URLs에 로컬 서버 주소(http://localhost:5000/leitner_app.html)가 등록되어 있어야 정상 작동합니다."
          );
          return;
        }

        setAuthLoading(true);
        try {
          const { error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: window.location.origin + window.location.pathname
            }
          });
          if (error) throw error;
        } catch (err) {
          alert("구글 로그인 오류: " + err.message);
        } finally {
          setAuthLoading(false);
        }
      };

      // --- Study Session Actions ---
      const startStudy = () => {
        const today = new Date().toISOString().split('T')[0];
        const due = cards.filter(c => !c.is_graduated && c.next_review_at <= today);
        setSessionDeck(due.sort(() => Math.random() - 0.5));
        setCurrentIndex(0);
        setIsRevealed(false);
        setTimeLeft(config.timerDuration);
      };

      useEffect(() => {
        if (activeTab === 'study' && user && sessionDeck.length === 0) startStudy();
      }, [activeTab, cards]);

      const handleEvaluate = async (isKnown) => {
        const card = sessionDeck[currentIndex];
        // "Hell's Reset" rule: demote directly to Stage 1 if failed. Otherwise, increment stage.
        let newStage = isKnown ? Math.min(card.stage + 1, 7) : 1;
        const nextDate = new Date();
        nextDate.setDate(nextDate.getDate() + (config.intervals[newStage] || 1));
        
        const nextDateStr = nextDate.toISOString().split('T')[0];
        const todayStr = new Date().toISOString().split('T')[0];

        try {
          // Sync directly to Cloud Database
          const { error } = await supabase
            .from('agri_cards')
            .update({
              stage: newStage,
              is_graduated: newStage === 7,
              last_reviewed_at: todayStr,
              next_review_at: nextDateStr
            })
            .eq('id', card.id);

          if (error) throw error;

          // Update local state
          setCards(cards.map(c => c.id === card.id ? { 
            ...c, 
            stage: newStage, 
            is_graduated: newStage === 7, 
            last_reviewed_at: todayStr, 
            next_review_at: nextDateStr 
          } : c));

          if (currentIndex < sessionDeck.length - 1) {
            setCurrentIndex(p => p + 1);
            setIsRevealed(false);
            setTimeLeft(config.timerDuration);
          } else {
            setSessionDeck([]); 
          }
        } catch (err) {
          alert("학습 상태 저장 실패: " + err.message);
        }
      };

      // --- AI Word Generator Logic ---
      const generateWord = async (e) => {
        e.preventDefault();
        if (!apiKey) { showToast("계정 & 결제(Billing) 탭에서 Gemini API Key를 먼저 등록해 주십시오.", "error"); return; }
        if (!genKeyword.trim()) return;

        // B2B/B2C Free Tier Usage Cap (Monthly 5 generations limit)
        const currentCount = profile?.ai_generations_count ?? 0;
        if (profile && profile.tier === 'Free' && currentCount >= 5) {
          setIsUpgradeModalOpen(true);
          return;
        }

        setIsGenerating(true);
        setGenResult(null);
        setGenStep(1);

        // Start step interval for visual data UX progress
        const stepInterval = setInterval(() => {
          setGenStep(prev => prev < 4 ? prev + 1 : prev);
        }, 1200);

        const prompt = `당신은 시설원예, 식물보호, 종자 생산 및 농업 법인 경영 전문가입니다. 
주어진 키워드: '${genKeyword}'
이 키워드에 해당하는 대표적인 학명/영단어(또는 관련 영단어)를 분석하여 반드시 아래 JSON 형식으로만 응답하십시오. 다른 설명이나 텍스트, 마크다운 코드 블록 외부 기호는 절대 포함하지 마십시오.
{
  "term": "해당 영단어",
  "meaning": "한글 뜻",
  "morphology": {"prefix": "접두사 분석", "root": "어근 분석", "suffix": "접미사 분석"},
  "context_sentence": "시설원예, 식물보호, 농업 비즈니스 실무와 관련된 고품질 예문"
}`;

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });
          
          if (!response.ok) {
            throw new Error(`API 요청 실패 (코드 ${response.status})`);
          }

          const data = await response.json();
          if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0]) {
            let text = data.candidates[0].content.parts[0].text;
            
            // Clean markdown blocks
            text = text.replace(/```json/gi, '').replace(/```/g, '').trim();
            const parsed = JSON.parse(text);
            setGenResult(parsed);
            showToast(`'${parsed.term}' 단어가 성공적으로 생성되었습니다.`, "success");

            // Increment usage limit in Cloud Profile Database (Null-safe)
            const nextCount = (profile?.ai_generations_count ?? 0) + 1;
            const { data: updatedProfile, error: updateError } = await supabase
              .from('agri_profiles')
              .update({ ai_generations_count: nextCount })
              .eq('id', user.id)
              .select()
              .single();

            if (!updateError) setProfile(updatedProfile);
          } else {
            throw new Error("AI 응답 데이터 구조가 잘못되었습니다.");
          }
        } catch (err) {
          console.error(err);
          showToast("단어 생성 실패: " + err.message, "error");
        } finally {
          clearInterval(stepInterval);
          setIsGenerating(false);
        }
      };

          context_sentence: genResult.context_sentence,

          next_review_at: new Date().toISOString().split('T')[0],

          setCards([data[0], ...cards]);

        } catch (err) {
          alert("클라우드 단어 추가 실패: " + err.message);
        }

            return { ...c, daysLeft: diffDays };

                    <input name="prefix" defaultValue={editingCard?.morphology.prefix} className="bg-slate-50 dark:bg-slate-950 border border-slate-100 dark:border-slate-750 rounded-xl p-3 text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-1 focus:ring-emerald-500" placeholder="Prefix" />
                    <input name="root" defaultValue={editingCard?.morphology.root} className="bg-slate-50 dark:bg-slate-950 border border-slate-100 dark:border-slate-750 rounded-xl p-3 text-xs font-bold text-slate-900 dark:text-white focus:outline-none focus:ring-1 focus:ring-emerald-500" placeholder="Root" />
                    <input name="suffix" defaultValue={editingCard?.morphology.suffix} className="bg-slate-50 dark:bg-slate-950 border border-slate-100 dark:border-slate-750 rounded-xl p-3 text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-1 focus:ring-emerald-500" placeholder="Suffix" />
                  </div>
                  <textarea 
                    name="context" 
                    defaultValue={editingCard?.context_sentence} 
                    rows="3" 
                    className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-100 dark:border-slate-750 rounded-2xl p-4 text-sm leading-relaxed text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-emerald-500" 
                    placeholder="Business Context Sentence"
                  ></textarea>
                  <div className="flex gap-4 pt-4">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 py-4 font-black text-slate-400 dark:text-slate-500 hover:text-slate-650 dark:hover:text-slate-350 transition-all">CANCEL</button>
                    <button type="submit" className="flex-1 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 py-4 rounded-2xl font-black shadow-xl hover:bg-slate-800 dark:hover:bg-white transition-all">SAVE DATA</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* SaaS Plan Subscription Upgrade Modal (Mock Billing Interface) */}
          {isUpgradeModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 dark:bg-black/80 backdrop-blur-sm p-6">
              <div className="w-full max-w-md bg-white dark:bg-slate-850 rounded-[40px] p-10 shadow-2xl border border-slate-100 dark:border-slate-800 animate-[fadeIn_0.2s_ease-out] transition-colors duration-300 relative overflow-hidden">
                
                {/* Close Button */}
                <button 
                  onClick={() => setIsUpgradeModalOpen(false)}
                  className="absolute right-6 top-6 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xl font-bold"
                >
                  ✕
                </button>

                <div className="text-center space-y-4">
                  <span className="bg-emerald-100 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 text-[10px] font-black px-3 py-1.5 rounded-full">PLAN UPGRADE</span>
                  <h4 className="text-2xl font-black text-slate-800 dark:text-slate-100">무료 사용량이 초과되었습니다!</h4>
                  <p className="text-xs text-slate-400 dark:text-slate-500 leading-relaxed">
                    Free 플랜은 AI 단어 자동 생성이 **월 5회**로 차단됩니다. 아래의 우수 구독 플랜으로 즉시 업그레이드하여 농업 생산성을 강화해 보세요!
                  </p>
                </div>

                <div className="mt-8 space-y-4">
                  {/* Pro Plan Card */}
                  <div className="p-5 border-2 border-emerald-500 dark:border-emerald-600 bg-emerald-50/10 dark:bg-emerald-950/10 rounded-2xl flex justify-between items-center">
                    <div>
                      <span className="text-xs font-black text-emerald-600 dark:text-emerald-400 uppercase">Pro Enterprise Plan</span>
                      <h5 className="font-bold text-slate-800 dark:text-slate-100 text-base mt-1">AI 단어 생성 무제한</h5>
                      <p className="text-[10px] text-slate-400 mt-0.5">망각 단계 다중 통계 기능 포함</p>
                    </div>
                    <div className="text-right">
                      <span className="text-sm font-black text-slate-800 dark:text-slate-100">₩19,900</span>
                      <p className="text-[9px] text-slate-400">/ 월</p>
                    </div>
                  </div>

                  {/* Mock Credit Card Inputs */}
                  <div className="space-y-3 pt-2">
                    <label className="text-[9px] font-black uppercase text-slate-400 dark:text-slate-500 tracking-wider">신용카드 결제 정보 입력 (모의 결제)</label>
                    <input 
                      type="text" 
                      disabled
                      className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-750 rounded-xl p-3.5 text-xs text-slate-400 dark:text-slate-500 focus:outline-none" 
                      defaultValue="4215 •••• •••• 9924 (테스트 카드 기본 탑재)" 
                    />
                  </div>

                  {/* Google Pay Button Container */}
                  {isGooglePayReady && (
                    <div className="space-y-3 pt-2">
                      <label className="text-[9px] font-black uppercase text-slate-400 dark:text-slate-500 tracking-wider">간편 결제 (Google Pay)</label>
                      <div id="google-pay-button-container" className="w-full min-h-[48px] rounded-2xl overflow-hidden shadow-md"></div>
                    </div>
                  )}

                  <div className="flex gap-4 pt-4">
                    <button 
                      type="button" 
                      onClick={() => setIsUpgradeModalOpen(false)} 
                      className="flex-1 py-4 font-black text-slate-400 dark:text-slate-500 hover:text-slate-650 dark:hover:text-slate-350 transition-all text-xs"
                    >
                      다음에 하기
                    </button>
                    <button 
                      type="button" 
                      onClick={upgradeToPro}
                      disabled={payLoading}
                      className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-black shadow-xl transition-all text-xs flex items-center justify-center gap-2"
                    >
                      {payLoading ? <div className="spinner"></div> : "안전 결제 및 업그레이드"}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
